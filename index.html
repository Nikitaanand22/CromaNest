<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colorful Coke Bottles</title>
  <link rel="stylesheet" href="style.css"/>

</head>

<body>
  <header>
    <h1>Colorful Coke Bottles</h1>
    <p>Click the color-change button to change each bottle color.</p>
  </header>

  <main class="bottles">
    <section class="bottle-card" style="--bottle-color: #e91325;">
      <div class="bottle">
        <div class="bottle-label">COKE</div>
      </div>

      <h2 class="bottle-name">Classic Red</h2>
      <p class="bottle-price">₹40</p>
      <button class="change-color-btn">🎨 Change Color</button>
    </section>

    <section class="bottle-card" style="--bottle-color: #124690;">
      <div class="bottle">
        <div class="bottle-label">COKE</div>
      </div>
      <h2 class="bottle-name">Cool Blue</h2>
      <p class="bottle-price">₹40</p>
      <button class="change-color-btn">🎨 Change Color</button>
    </section>

    <section class="bottle-card" style="--bottle-color: #0b612c;">
      <div class="bottle">
        <div class="bottle-label">COKE</div>
      </div>
      <h2 class="bottle-name">Fresh Green</h2>
      <p class="bottle-price">₹40</p>
      <button class="change-color-btn">🎨 Change Color</button>
    </section>

    <section class="bottle-card" style="--bottle-color: #ffb703;">
      <div class="bottle">
        <div class="bottle-label">COKE</div>
      </div>
      <h2 class="bottle-name">Sunny Yellow</h2>
      <p class="bottle-price">₹40</p>
      <button class="change-color-btn">🎨 Change Color</button>
    </section>
  </main>

  <footer>
    Made with HTML, CSS &amp; JavaScript
  </footer>

<script src="script.js" defer></script>

</body>
</html>
